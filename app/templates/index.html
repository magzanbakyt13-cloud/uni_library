{% extends "base.html" %}
{% block content %}
<div class="p-5 mb-4 bg-white rounded-3 shadow-sm text-center">
    <h1 class="display-4 font-weight-bold">Университетская Библиотека</h1>
    <p class="lead">Система учета книг, авторов и выдачи материалов студентам.</p>
    <a class="btn btn-primary btn-lg" href="{{ url_for('books.list_books') }}" role="button">Перейти к каталогу</a>
</div>

<div class="row text-center">
    <div class="col-md-4">
        <div class="card p-3 shadow-sm mb-3">
            <h3>{{ total_books }}</h3>
            <p class="text-muted">Всего книг</p>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-3 shadow-sm mb-3">
            <h3>{{ total_authors }}</h3>
            <p class="text-muted">Авторов</p>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-3 shadow-sm mb-3">
            <h3>{{ active_loans }}</h3>
            <p class="text-muted">Активных выдач</p>
        </div>
    </div>
</div>
{% endblock %}
